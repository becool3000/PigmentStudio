[package]
name = "pigment-blender"
version = "0.3.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/becool3000/PigmentStudio"
description = "Native C-ABI GPU bridge for Pigment Studio's Kubelka-Munk oil paint engine in Blender"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pigment-engine = { path = "../pigment-engine" }
pollster = "0.4"
wgpu = "24"
