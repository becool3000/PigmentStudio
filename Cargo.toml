[workspace]
members = [".", "crates/pigment-engine", "crates/pigment-blender"]

[package]
name = "pigment-prototype"
version = "0.3.2"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/becool3000/PigmentStudio"
description = "A Windows workbench for GPU-simulated wet oil painting"

[[bin]]
name = "pigment-studio-ink"
path = "src/main.rs"

[dependencies]
pigment-engine = { path = "crates/pigment-engine" }
bytemuck = { version = "1", features = ["derive"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false }
png = "0.17"
pollster = "0.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
wgpu = "24"
winit = "0.30"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Console"] }
